name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

  server-test:
    name: 服务端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装服务端依赖
        working-directory: server
        run: npm install

      - name: 服务端语法检查
        working-directory: server
        run: node --check index.js && node --check config.js && node --check db.js

  lint:
    name: 代码规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: ESLint 检查
        run: npx eslint src/ --ext .ts,.tsx || true
